# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
        args: [--allow-multiple-documents]
    -   id: check-json
    -   id: fix-encoding-pragma
        args: [--remove]
    -   id: check-added-large-files
-   repo: https://github.com/PyCQA/flake8
    # La misma versión que usamos en requirements-lint.txt
    rev: 3.7.8
    hooks:
    -   id: flake8
        args: [--config, src/.flake8]
        exclude: ^src/density_field_properties/haloscope/haloscope\.py$
-   repo: https://github.com/psf/black
    rev: 23.1.0
    hooks:
    -   id: black
        args: [--config, src/pyproject.toml]
        exclude: ^src/density_field_properties/haloscope/haloscope\.py$
-   repo: https://github.com/PyCQA/isort
    rev: 5.11.5
    hooks:
    -   id: isort
        args: [--settings-file, src/pyproject.toml]
        exclude: ^src/density_field_properties/haloscope/haloscope\.py$
